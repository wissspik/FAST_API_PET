<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Социальная сеть | Dark Theme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#121212',
                            800: '#1E1E1E',
                            700: '#252525',
                            600: '#2E2E2E',
                            500: '#3A3A3A',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .divider {
            width: 1px;
            background-color: rgba(255, 255, 255, 0.1);
        }
        .menu-item {
            transition: all 0.2s ease;
        }
        .menu-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
            transform: translateX(2px);
        }
        .dropdown {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s ease;
        }
        .dropdown.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .profile-icon {
            transition: all 0.2s ease;
        }
        .profile-icon:hover {
            transform: scale(1.1);
        }
        @media (max-width: 768px) {
            .left-column {
                width: 70px;
            }
            .menu-text {
                display: none;
            }
            .right-column {
                width: 60px;
            }
        }
    </style>
</head>
<body class="bg-dark-900 text-gray-200 min-h-screen flex">
    <!-- Левая колонка - Меню -->
    <div class="left-column w-64 bg-dark-800 flex-shrink-0 h-screen sticky top-0 overflow-y-auto">
        <div class="p-4 border-b border-dark-700">
            <h1 class="text-xl font-bold text-center">Graut :)</h1>
        </div>
        <nav class="mt-6">
            <div class="menu-item flex items-center px-6 py-3 cursor-pointer bg-dark-700">
                <i class="fas fa-user w-6 text-center mr-3 text-blue-400"></i>
                <span class="menu-text">Профиль</span>
            </div>
            <div class="menu-item flex items-center px-6 py-3 cursor-pointer">
                <i class="fas fa-newspaper w-6 text-center mr-3"></i>
                <span class="menu-text">Лента</span>
            </div>
            <div class="menu-item flex items-center px-6 py-3 cursor-pointer">
                <i class="fas fa-comment-dots w-6 text-center mr-3"></i>
                <span class="menu-text">Мессенджер</span>
            </div>
            <div class="menu-item flex items-center px-6 py-3 cursor-pointer">
                <i class="fas fa-question-circle w-6 text-center mr-3"></i>
                <span class="menu-text">Помощь</span>
            </div>
        </nav>
    </div>

    <!-- Центральная колонка - Контент -->
    <div class="divider"></div>
    <main class="flex-1 bg-dark-900 p-6 overflow-y-auto">
        <div class="max-w-4xl mx-auto h-full flex flex-col items-center justify-center">
            <div class="text-center">
                <i class="fas fa-compass text-5xl text-gray-600 mb-4"></i>
                <h2 class="text-2xl font-semibold text-gray-400">Выберите раздел</h2>
                <p class="text-gray-500 mt-2">Начните с выбора раздела в меню слева</p>
            </div>
        </div>
    </main>

    <!-- Правая колонка - Профиль -->
    <div class="divider"></div>
    <div class="right-column w-80 bg-dark-800 flex-shrink-0 h-screen sticky top-0 overflow-y-auto p-4">
        <div class="flex justify-end relative">
            <div class="profile-icon w-10 h-10 rounded-full bg-dark-700 flex items-center justify-center cursor-pointer" id="profileBtn">
                <i class="fas fa-user text-lg"></i>
            </div>

            <div class="dropdown absolute top-12 right-0 bg-dark-700 rounded-md shadow-lg py-2 w-48 z-10" id="profileDropdown">
                <div class="px-4 py-2 hover:bg-dark-600 cursor-pointer flex items-center">
                    <i class="fas fa-chart-line mr-3 text-sm"></i>
                    <span>Статистика</span>
                </div>
                <div class="px-4 py-2 hover:bg-dark-600 cursor-pointer flex items-center">
                    <i class="fas fa-cog mr-3 text-sm"></i>
                    <span>Настройки</span>
                </div>
                <div class="border-t border-dark-600 mt-1"></div>
                <div class="px-4 py-2 hover:bg-dark-600 cursor-pointer text-red-400 flex items-center" id="logoutBtn">
                    <i class="fas fa-sign-out-alt mr-3 text-sm"></i>
                    <span>Выход</span>
                </div>
            </div>
        </div>

        <div class="mt-8 p-4 bg-dark-700 rounded-lg hidden md:block">
            <h3 class="font-medium mb-3">Рекомендации</h3>
            <p class="text-sm text-gray-400">Включите уведомления, чтобы не пропустить новые события</p>
            <button class="mt-3 bg-blue-500 hover:bg-blue-600 text-white text-sm px-3 py-1 rounded-md transition">
                Включить
            </button>
        </div>
    </div>

    <script>
        // Обработка клика по иконке профиля
        const profileBtn = document.getElementById('profileBtn');
        const profileDropdown = document.getElementById('profileDropdown');

        profileBtn.addEventListener('click', function() {
            profileDropdown.classList.toggle('active');
        });

        // Закрытие dropdown при клике вне его
        document.addEventListener('click', function(event) {
            if (!profileBtn.contains(event.target) && !profileDropdown.contains(event.target)) {
                profileDropdown.classList.remove('active');
            }
        });

        // Кнопка выхода
        const logoutBtn = document.getElementById('logoutBtn');
        logoutBtn.addEventListener('click', async function () {
            try {
                await fetch('/logout', { method: 'POST', credentials: 'include' });
                window.location.href = '/login';
            } catch (e) {
                console.error('Logout failed', e);
            }
        });
    </script>
</body>
</html>
