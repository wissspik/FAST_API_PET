services:
  kong-database:
    environment:
      DB_USER: kong
      DB_PASSWORD: kong
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: kong_db
    volumes:
      - kong-database-vol:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_started
    networks:
      - kong-net
  kong-migrations:
      image: kong:3
      depends_on:
        - kong-database
      command: kong migrations bootstrap
      environment:
        DB_USER: kong
        DB_PASSWORD: kong
        DB_HOST: postgres
        DB_PORT: 5432
        DB_NAME: kong_db
  kong:
    image: kong:3
    restart: always
    depends_on:
      - kong-database
      - kong-migrations
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong_db

      KONG_PROXY_LISTEN: '0.0.0.0:8000, 0.0.0.0:8443 ssl'

      KONG_ADMIN_LISTEN: '0.0.0.0:8001, 0.0.0.0:8444 ssl'

      KONG_LOG_LEVEL: info





volumes:
  kong-database-vol:

networks:
  kong-net: