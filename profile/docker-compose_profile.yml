services:
  service_profile:
    container_name: service_profile
    build:
      context: .
      dockerfile: profile/Dockerfile
    env_file:
      - profile/.env
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
    ports:
      - "8002:8000"
    networks:
      - common_net
networks:
  common_net:
    external: true