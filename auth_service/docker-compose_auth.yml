volumes:
  redis-data:

services:
  backend:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    env_file:
      - auth_service/.env
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    networks:
      - common_net

  redis:
    image: redis:latest
    container_name: redis-server
    ports:
      - "6379:6379"
    depends_on:
      - postgres
      - backend
    command: >
      sh -c "chown -R redis:redis /data/redis-data && \ exec redis-server --appendonly yes --dir /data/redis-data"
    restart: unless-stopped
    networks:
      - common_net

networks:
  common_net:
    external: true
