volumes:
  redis-data:

services:
  service_auth:
    container_name: service_auth
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    env_file:
      - auth_service/.env
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
    ports:
      - "8001:8000"
    networks:
      - common_net
  redis:
    image: redis:latest
    container_name: redis-server
    ports:
      - "6379:6379"
    command: >
      sh -c "chown -R redis:redis /data/redis-data && exec redis-server --appendonly yes --dir /data/redis-data"
    volumes:
      - redis-data:/data/redis-data
    restart: unless-stopped
    networks:
      - common_net

networks:
  common_net:
    external: true
