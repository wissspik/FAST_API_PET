services:
  postgres:
    image: postgres:15.4
    container_name: postgres
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: strongpass
      POSTGRES_DB: full_db

  redis:
    image: redis:7.2
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  service_auth:
    container_name: entrance
    build:
      context: .
      dockerfile: backend/entrance/Dockerfile
    env_file:
      - backend/entrance/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-change-me
      ACCESS_TTL_MIN: "15"
      REFRESH_TTL_SECONDS: "604800"
    depends_on:
      - postgres
      - redis
    ports:
      - "8001:8001"

volumes:
  postgres_data:
  redis_data:
